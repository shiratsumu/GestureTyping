<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>練習セッション - ジェスチャータイピング実験</title>
    <link rel="icon" href="images/Gesture-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./p5.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
    :root {
      --body-bg-color: #373737;
      --body-text-color: #bdbdbd;
      --muted-text-color: #d4d4d4;
      --overlay-bg-color: rgba(55, 65, 81, 0.8);
      --ui-element-bg-color: #848484;
      --button-primary-bg-color: #6f7e97;
      --button-primary-hover-bg-color: #666e7d;
      --error-text-color: #f87171;
      --char-display-bg-color: rgba(229, 231, 235, 0.9);
      --game-info-bg-color: #707070;
      --input-bg-color: #484848;
      --input-text-color: #ffffff;
      --error-message-bg-color: #fee2e2;
      --error-message-border-color: #f87171;
      --error-message-text-color: #b91c1c;
    }
    </style>
</head>
<body style="background-color: var(--body-bg-color); color: var(--body-text-color);">

    <!-- メインカメラエリア（全画面） -->
    <main id="canvas-container" class="absolute inset-0 w-full h-full">
        <!-- p5.jsがここにCanvasを生成します -->
    </main>

    <!-- 上部ヘッダー：練習情報 -->
    <header class="absolute top-0 left-0 right-0 z-20 p-4" style="background: linear-gradient(to bottom, rgba(55, 55, 55, 0.9), rgba(55, 55, 55, 0));">
        <div class="flex items-center justify-between">
            <button id="backBtn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg" onclick="goBack()">
                ← 戻る
            </button>
            <div class="text-center">
                <h1 class="text-xl font-bold" id="practiceTitle">練習セッション</h1>
                <p class="text-sm" style="color: var(--muted-text-color);" id="practiceSubtitle">
                    条件A （手のジェスチャーと口の開閉による入力）
                </p>
            </div>
            <div class="text-right">
                <div class="text-lg font-mono" id="practiceTimer">02:00</div>
                <div class="text-xs" style="color: var(--muted-text-color);">残り時間</div>
            </div>
        </div>
    </header>

    <!-- 右上：文字入力状況表示UI -->
    <div id="character-display" class="absolute top-20 right-4 z-10 rounded-lg p-4 w-40 sm:w-64 hidden" style="background-color: var(--char-display-bg-color);">
        <div id="char-list" class="flex flex-col items-center space-y-3">
            <!-- 文字がJavaScriptで動的に追加されます -->
        </div>
    </div>

    <!-- ローディングとスタートボタン用のオーバーレイ -->
    <div id="ui-overlay" class="absolute inset-0 z-10 flex flex-col justify-center items-center text-center p-4" style="background-color: var(--overlay-bg-color);">
        <div id="loading-ui">
            <p class="text-lg mb-2">MediaPipeモデルを読み込んでいます...</p>
            <div class="loader"></div>
        </div>
        <div id="start-ui" class="hidden">
            <div class="bg-gray-700 rounded-lg p-6 mb-6 max-w-md">
                <h2 class="text-xl font-semibold mb-4" id="modeDescription">手のジェスチャー練習</h2>
                <p class="text-gray-300 mb-4" id="modeInstructions">
                    手でジェスチャーを作り、口を開いて閉じることで文字を確定します。
                </p>
                <p class="text-sm text-gray-400">
                    2分間の練習時間です。自由にタイピングして操作に慣れてください。
                </p>
            </div>
            <button id="startPracticeBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg" onclick="startPractice()">
                練習を開始する
            </button>
        </div>
        <div id="error-ui" class="hidden" style="color: var(--error-text-color);">
            <p>エラーが発生しました。</p>
            <p id="error-message" class="text-sm"></p>
        </div>
    </div>

    <!-- 下部：ゲーム用のUI要素 (練習中に表示) -->
    <div id="game-ui" class="absolute bottom-0 left-0 right-0 z-10 p-4 hidden" style="background: linear-gradient(to top, rgba(55, 55, 55, 0.9), rgba(55, 55, 55, 0));">
        <div class="max-w-4xl mx-auto">
            <div class="rounded-md p-3 mb-3 text-center" style="background-color: var(--game-info-bg-color);">
                <h5 class="font-semibold text-base">練習用フレーズ:</h5>
                <p id="message" class="text-xl font-mono tracking-wider break-words">hello world</p>
            </div>
            <div>
                <div id="typing-input" class="w-full p-3 rounded-md text-xl font-mono tracking-wider text-center" style="background-color: var(--input-bg-color); color: var(--input-text-color); min-height: 50px; white-space: pre-wrap; word-break: break-all;"></div>
            </div>
            
            <!-- エラーメッセージ表示エリア -->
            <div id="error-message-display" class="mt-3 p-3 border rounded-md text-center hidden" style="background-color: var(--error-message-bg-color); border-color: var(--error-message-border-color); color: var(--error-message-text-color);">
                <div class="font-bold text-base">入力エラー</div>
                <div id="error-text" class="text-sm mt-1">間違った文字が入力されました。削除ジェスチャー (5,5) で削除してください。</div>
            </div>
            
            <div class="flex justify-center mt-4">
                <button id="resetBtn" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded mr-4" onclick="resetCurrentPhrase()">
                    リセット
                </button>
                <button id="newPhraseBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" onclick="getNewPhrase()">
                    新しいフレーズ
                </button>
            </div>
        </div>
    </div>

    <!-- 練習完了モーダル -->
    <div id="completionModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
            <h2 class="text-xl font-bold mb-4 text-center text-green-400">練習完了！</h2>
            <p class="text-gray-300 mb-6 text-center">
                お疲れ様でした。操作に慣れましたか？<br>
                本実験に進みます。
            </p>
            <div class="flex justify-center">
                <button id="proceedBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg" onclick="proceedToExperiment()">
                    本実験へ進む
                </button>
            </div>
        </div>
    </div>

    <!-- MediaPipe初期化を先に行うスクリプト -->
    <script type="module">
        import { initializeLandmarkers } from './mediapipe_manager.js';
        
        // MediaPipe関数をグローバルスコープに即座に公開
        window.initializeLandmarkers = initializeLandmarkers;
        console.log("initializeLandmarkers exported to global scope");
    </script>

    <!-- sketch.jsをインポート -->
    <script type="module" src="sketch.js"></script>
    
    <script type="module">
        import { logger } from './logger.js';

        let currentCondition = '';
        let countdownInterval = null;
        let totalPracticeTime = 120; // 2分
        let timeRemaining = totalPracticeTime;
        let practiceStarted = false;

        // 練習用フレーズプール（短めで練習しやすいもの）
        const practiceePhrases = [
            'hello world',
            'good morning',
            'thank you',
            'see you later',
            'how are you',
            'nice to meet you',
            'have a good day',
            'take care'
        ];

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            currentCondition = urlParams.get('cond') || 'A';
            
            updateUIForCondition();
            await initializeMediaPipe();
        });

        function updateUIForCondition() {
            const conditionName = currentCondition === 'A' ? '手のジェスチャー（リップクリック）' : 'お口のジェスチャー（時間経過）';
            
            document.getElementById('practiceSubtitle').textContent = `条件${currentCondition}（${conditionName}）`;
            
            if (currentCondition === 'A') {
                document.getElementById('modeDescription').textContent = '手のジェスチャー練習';
                document.getElementById('modeInstructions').textContent = 
                    '手でジェスチャーを作り、口を開いて閉じることで文字を確定します。';
            } else {
                document.getElementById('modeDescription').textContent = 'お口のジェスチャー練習';
                document.getElementById('modeInstructions').textContent = 
                    '手でジェスチャーを作り、1秒間保持することで文字を確定します。';
            }
        }

        async function initializeMediaPipe() {
            try {
                console.log("Starting MediaPipe initialization...");
                document.getElementById('loading-ui').innerHTML = '<p class="text-lg mb-2">MediaPipeモデルを読み込んでいます...</p><div class="loader"></div><p class="text-sm mt-2">Step 1: Checking functions...</p>';
                
                // MediaPipeの初期化を待つ - より短いインターバルでチェック
                console.log("Checking for initializeLandmarkers...", typeof window.initializeLandmarkers);
                if (typeof window.initializeLandmarkers !== 'undefined') {
                    console.log("initializeLandmarkers found, calling directly...");
                    document.getElementById('loading-ui').innerHTML += '<p class="text-sm">Step 2: Calling initializeLandmarkers...</p>';
                    await window.initializeLandmarkers();
                } else {
                    console.log("initializeLandmarkers not found, waiting...");
                    document.getElementById('loading-ui').innerHTML += '<p class="text-sm">Step 2: Waiting for MediaPipe initialization...</p>';
                    // より短いインターバルで関数の存在をチェック
                    await new Promise((resolve, reject) => {
                        const checkInterval = setInterval(() => {
                            console.log("Checking for initializeLandmarkers...", typeof window.initializeLandmarkers);
                            if (typeof window.initializeLandmarkers !== 'undefined') {
                                clearInterval(checkInterval);
                                resolve();
                            }
                        }, 50); // 50msインターバルに短縮
                        
                        // 15秒後にタイムアウト
                        setTimeout(() => {
                            clearInterval(checkInterval);
                            reject(new Error('initializeLandmarkers function not found after 15 seconds'));
                        }, 15000);
                    });
                    console.log("initializeLandmarkers found after waiting, calling...");
                    document.getElementById('loading-ui').innerHTML += '<p class="text-sm">Step 3: Found initializeLandmarkers, calling...</p>';
                    await window.initializeLandmarkers();
                }
                
                console.log("MediaPipe initialization successful");
                document.getElementById('loading-ui').innerHTML += '<p class="text-sm">Step 4: Success!</p>';
                
                // 成功した場合
                document.getElementById('loading-ui').classList.add('hidden');
                document.getElementById('start-ui').classList.remove('hidden');
                
            } catch (err) {
                console.error("MediaPipe initialization failed:", err);
                // 失敗した場合
                document.getElementById('loading-ui').classList.add('hidden');
                document.getElementById('error-ui').classList.remove('hidden');
                document.getElementById('error-message').textContent = err.message;
            }
        }

        window.startPractice = async function() {
            if (!practiceStarted) {
                practiceStarted = true;
                
                // カメラを起動
                if (typeof startCamera !== 'undefined') {
                    await startCamera();
                }
                
                // 練習モードを有効にする
                if (typeof setPracticeMode !== 'undefined') {
                    setPracticeMode(true);
                }
                
                // 入力モードを設定
                const mode = currentCondition === 'A' ? window.INPUT_MODE.LIP_CLICK : window.INPUT_MODE.TIME_HOLD;
                if (typeof setInputMode !== 'undefined') {
                    setInputMode(mode);
                }
                
                // ゲームモードを練習モードに設定
                if (window.game_mode) {
                    window.game_mode.now = "playing";
                }
                
                // 最初の練習フレーズを設定
                setRandomPracticePhrase();
                
                // UIの切り替え
                document.getElementById('ui-overlay').classList.add('hidden');
                document.getElementById('game-ui').classList.remove('hidden');
                
                // カウントダウン開始
                startCountdown();
                
                console.log(`Practice started: condition ${currentCondition}, mode ${mode}`);
            }
        };

        function setRandomPracticePhrase() {
            const randomPhrase = practiceePhrases[Math.floor(Math.random() * practiceePhrases.length)];
            document.getElementById('message').textContent = randomPhrase;
            
            // sketch.jsに目標フレーズを設定
            if (typeof setTargetPhrase !== 'undefined') {
                setTargetPhrase(randomPhrase);
            }
        }

        function startCountdown() {
            timeRemaining = totalPracticeTime;
            updateTimerDisplay();
            
            countdownInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                    completePractice();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('practiceTimer').textContent = display;
        }

        function completePractice() {
            // 練習モードを無効にする
            if (typeof setPracticeMode !== 'undefined') {
                setPracticeMode(false);
            }
            
            // カメラを停止
            if (typeof stopCamera !== 'undefined') {
                stopCamera();
            }
            
            // 完了モーダルを表示
            document.getElementById('completionModal').classList.remove('hidden');
            document.getElementById('completionModal').classList.add('flex');
        }

        window.resetCurrentPhrase = function() {
            const currentPhrase = document.getElementById('message').textContent;
            document.getElementById('typing-input').innerHTML = '';
            
            // sketch.jsのゲーム状態をリセット
            if (typeof setTargetPhrase !== 'undefined') {
                setTargetPhrase(currentPhrase);
            }
        };

        window.getNewPhrase = function() {
            setRandomPracticePhrase();
            document.getElementById('typing-input').innerHTML = '';
        };

        window.goBack = function() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            // 練習モードを無効にする
            if (typeof setPracticeMode !== 'undefined') {
                setPracticeMode(false);
            }
            
            if (typeof stopCamera !== 'undefined') {
                stopCamera();
            }
            window.location.href = 'attributes.html';
        };

        window.proceedToExperiment = function() {
            window.location.href = `experiment.html?cond=${currentCondition}&trial=1`;
        };

        // sketch.jsからの文章完了イベントを受信（練習では新しいフレーズに自動変更）
        window.addEventListener('sentenceCompleted', (event) => {
            if (practiceStarted && timeRemaining > 0) {
                console.log("Sentence completed in practice mode, setting new phrase");
                // 即座に新しいフレーズを設定
                setTimeout(() => {
                    setRandomPracticePhrase();
                    // 入力エリアをクリア
                    const typingInput = document.getElementById('typing-input');
                    if (typingInput) {
                        typingInput.innerHTML = '';
                    }
                }, 500); // 0.5秒後に新しいフレーズ
            }
        });
    </script>
</body>
</html>
