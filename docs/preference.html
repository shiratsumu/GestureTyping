<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>好み評価</title>
    <link rel="icon" href="images/Gesture-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-800 text-white min-h-screen p-4">
    <div class="max-w-3xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold">好み評価</h1>
            <p class="text-gray-300 mt-2">
                2つの入力方法について、あなたの好みを教えてください
            </p>
        </div>

        <form id="preferenceForm" class="space-y-8">
            <!-- 全体的な好み -->
            <div class="bg-gray-700 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">
                    全体的な好み
                </h2>
                
                <div class="mb-6">
                    <label class="block text-lg font-semibold mb-3">
                        どちらの入力方法が好みでしたか？
                    </label>
                    <div class="space-y-3">
                        <label class="flex items-center">
                            <input type="radio" name="preference" value="A" class="mr-3 scale-125">
                            <span class="text-lg">条件A: 手のジェスチャーと口の開閉による入力</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="preference" value="B" class="mr-3 scale-125">
                            <span class="text-lg">条件B: 手のみのジェスチャー</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="preference" value="どちらでもない" class="mr-3 scale-125">
                            <span class="text-lg">どちらでもない</span>
                        </label>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-lg font-semibold mb-3">
                        その理由を教えてください（任意）
                    </label>
                    <textarea 
                        name="preferenceReason"
                        rows="3"
                        class="w-full bg-gray-600 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="例: 手のジェスチャーの方が直感的だった、疲れにくかった、など"
                    ></textarea>
                </div>
            </div>

            <!-- 詳細評価 -->
            <div class="bg-gray-700 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">
                    詳細評価
                </h2>

                <!-- 使いやすさ -->
                <div class="mb-6">
                    <label class="block text-lg font-semibold mb-3">
                        使いやすさの観点で、どちらが良いと思いますか？
                    </label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="radio" name="usability" value="A" class="mr-3">
                            <span>条件A: 手のジェスチャーと口の開閉による入力</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="usability" value="B" class="mr-3">
                            <span>条件B: 手のみのジェスチャー</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="usability" value="どちらでもない" class="mr-3">
                            <span>どちらでもない</span>
                        </label>
                    </div>
                </div>

                <!-- 素早さ -->
                <div class="mb-6">
                    <label class="block text-lg font-semibold mb-3">
                        入力の素早さの観点で、どちらの方が良いと思いますか？
                    </label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="radio" name="speed" value="A" class="mr-3">
                            <span>条件A: 手のジェスチャーと口の開閉による入力</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="speed" value="B" class="mr-3">
                            <span>条件B: 手のみのジェスチャー</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="speed" value="どちらでもない" class="mr-3">
                            <span>どちらでもない</span>
                        </label>
                    </div>
                </div>

                <!-- 実用性 -->
                <div class="mb-6">
                    <label class="block text-lg font-semibold mb-3">
                        実用性（日常で使ってみたいか）の観点で、どちらが良いと思いますか？
                    </label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="radio" name="practicality" value="A" class="mr-3">
                            <span>条件A: 手のジェスチャーと口の開閉による入力</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="practicality" value="B" class="mr-3">
                            <span>条件B: 手のみのジェスチャー</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="practicality" value="どちらでもない" class="mr-3">
                            <span>どちらでもない</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 自由記述 -->
            <div class="bg-gray-700 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">
                    ご感想・ご意見
                </h2>
                
                <div class="mb-6">
                    <label class="block text-lg font-semibold mb-3">
                        実験全体を通してのご感想やご意見をお聞かせください（任意）
                    </label>
                    <textarea 
                        name="comments"
                        rows="4"
                        class="w-full bg-gray-600 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="実験の感想、改善点、その他お気づきの点など、自由にお書きください"
                    ></textarea>
                </div>
            </div>

            <div class="flex justify-between">
                <button 
                    type="button"
                    onclick="goBack()"
                    class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200"
                >
                    戻る
                </button>
                
                <button 
                    type="submit"
                    id="submitButton"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200 disabled:bg-gray-600 disabled:cursor-not-allowed"
                >
                    <span id="submitText">評価を完了する</span>
                    <span id="loadingText" class="hidden">送信中...</span>
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { logger } from './logger.js';

        // 送信状態を管理
        let isSubmitting = false;

        // リトライ機能付きの送信関数
        async function submitWithRetry(data, maxRetries = 3) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    console.log(`送信試行 ${attempt}/${maxRetries}...`);
                    await logger.logUserInfo(data);
                    console.log('データ送信成功');
                    return true;
                } catch (error) {
                    console.error(`送信試行 ${attempt} 失敗:`, error);
                    
                    if (attempt < maxRetries) {
                        // 指数バックオフで待機時間を増加
                        const waitTime = Math.pow(2, attempt) * 1000;
                        console.log(`${waitTime}ms待機後、再試行します...`);
                        await new Promise(resolve => setTimeout(resolve, waitTime));
                    }
                }
            }
            return false;
        }

        document.getElementById('preferenceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 二重送信防止
            if (isSubmitting) {
                console.log('既に送信中です');
                return;
            }
            
            const formData = new FormData(this);
            
            // 必須項目チェック
            if (!formData.get('preference')) {
                alert('全体的な好みを選択してください');
                return;
            }
            
            // UI状態を送信中に変更
            isSubmitting = true;
            const submitButton = document.getElementById('submitButton');
            const submitText = document.getElementById('submitText');
            const loadingText = document.getElementById('loadingText');
            
            submitButton.disabled = true;
            submitText.classList.add('hidden');
            loadingText.classList.remove('hidden');
            
            // 好み評価データを準備
            const preferenceData = {
                preference: formData.get('preference'),
                preferenceReason: formData.get('preferenceReason') || '',
                usability: formData.get('usability') || '',
                speed: formData.get('speed') || '',
                practicality: formData.get('practicality') || '',
                comments: formData.get('comments') || ''
            };
            
            // 全データを統合してGASに送信
            try {
                // これまでのデータを取得
                const userAttributes = JSON.parse(localStorage.getItem('user_attributes') || '{}');
                const fatigueData = JSON.parse(localStorage.getItem('fatigue_data') || '{}');
                
                // 統合データを作成
                const completeUserData = {
                    ...userAttributes,
                    ...fatigueData,
                    preference: preferenceData.preference,
                    comments: `理由: ${preferenceData.preferenceReason}\n使いやすさ: ${preferenceData.usability}\n素早さ: ${preferenceData.speed}\n実用性: ${preferenceData.practicality}\nコメント: ${preferenceData.comments}`
                };
                
                console.log('データ送信を開始します...');
                
                // リトライ機能付きでGASに送信
                const success = await submitWithRetry(completeUserData);
                
                if (success) {
                    // ローカルデータをクリア
                    localStorage.removeItem('user_attributes');
                    localStorage.removeItem('fatigue_data');
                    localStorage.removeItem('experiment_data');
                    
                    console.log('実験データの送信が完了しました');
                    
                    // 完了ページに遷移
                    window.location.href = 'thanks.html';
                } else {
                    throw new Error('最大試行回数に達しました');
                }
                
            } catch (error) {
                console.error('Data submission failed:', error);
                
                // UI状態を元に戻す
                isSubmitting = false;
                submitButton.disabled = false;
                submitText.classList.remove('hidden');
                loadingText.classList.add('hidden');
                
                // ユーザーに詳細な情報を提供
                const errorMessage = `データの送信に失敗しました。\n\n` +
                    `エラーの詳細: ${error.message}\n\n` +
                    `以下をお試しください：\n` +
                    `• しばらく待ってから再度お試しください\n` +
                    `• ネットワーク接続を確認してください\n` +
                    `• ページを再読み込みしてください\n\n` +
                    `問題が続く場合は、実験担当者にお知らせください。`;
                    
                alert(errorMessage);
            }
        });

        window.goBack = function() {
            if (isSubmitting) {
                alert('送信中です。しばらくお待ちください。');
                return;
            }
            window.location.href = 'fatigue.html';
        };
    </script>
</body>
</html>
